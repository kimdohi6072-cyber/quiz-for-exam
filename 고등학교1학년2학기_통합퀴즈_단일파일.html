'통합사회2':[
['ox','인권은 모든 사람이 인간답게 살기 위해 마땅히 누려야 할 권리이다.','O','인권은 인간의 존엄성과 자유·평등을 바탕으로 해요.'],['short','국가의 기본 질서와 국민의 기본권을 정한 최고 법은?',['헌법'],'헌법은 국가 운영의 기본 원칙을 정해요.'],['ox','모든 사람은 법 앞에서 평등하다는 원칙을 법치주의라고 한다.','X','법 앞의 평등은 평등권과 관련 있고, 법치주의는 법에 따라 국가를 운영하는 원리예요.'],['short','국가 권력이 국민의 자유를 부당하게 침해하지 못하게 하는 권리는?',['기본권'],'기본권은 헌법이 보장하는 국민의 기본적 권리예요.'],['ox','사회 정의는 사회 구성원에게 기회와 보상이 공정하게 분배되는 것과 관련 있다.','O','정의는 분배, 절차, 인정 등 여러 측면에서 생각할 수 있어요.'],['short','소득이나 재산 등이 사람들 사이에 고르게 분배되지 않은 상태는?',['불평등','사회불평등','사회 불평등'],'불평등은 경제·교육·지역 등 다양한 영역에서 나타날 수 있어요.'],['ox','능력과 노력의 차이를 고려하지 않고 모두에게 똑같이 나누는 것만이 항상 공정하다.','X','공정성은 상황과 필요, 기여 등을 함께 고려해 판단할 수 있어요.'],['short','사회 구성원이 최소한의 인간다운 생활을 할 수 있도록 국가가 보장하는 제도는?',['사회보장','사회 보장'],'사회 보장 제도는 생활의 위험으로부터 국민을 보호해요.'],['ox','시장 경제에서는 가격이 수요와 공급의 영향을 받아 결정된다.','O','수요와 공급의 변화는 시장 가격과 거래량에 영향을 줘요.'],['short','재화나 서비스를 얻기 위해 포기해야 하는 것 중 가장 가치가 큰 것은?',['기회비용','기회 비용'],'기회비용은 선택 때문에 포기한 대안의 가치예요.'],['ox','지속 가능한 발전은 현재 세대의 필요만 충족하면 되는 발전이다.','X','미래 세대의 필요를 해치지 않는 발전을 함께 고려해야 해요.'],['short','환경을 보전하면서 경제·사회 발전을 함께 추구하는 개념은?',['지속가능발전','지속 가능한 발전'],'지속 가능한 발전은 환경, 경제, 사회의 조화를 중요하게 봐요.'],['ox','세계화는 사람, 상품, 정보가 국경을 넘어 활발히 이동하는 현상과 관련 있다.','O','교통·통신의 발달은 세계화의 확산에 영향을 주었어요.'],['short','국가 간 갈등을 평화적으로 해결하기 위해 대화와 협력을 중시하는 태도는?',['평화'],'평화는 폭력이 없는 상태를 넘어 갈등을 협력적으로 해결하는 과정과 관련 있어요.'],['ox','문화의 다양성을 존중하는 것은 세계 시민에게 필요한 태도이다.','O','다양한 문화에 대한 이해와 존중은 세계 시민 의식의 중요한 요소예요.'],['short','서로 다른 나라와 지역의 문제를 함께 해결하려는 시민 의식은?',['세계시민의식','세계 시민 의식'],'세계 시민 의식은 인류 공동의 문제에 관심과 책임을 갖는 태도예요.'],['ox','기후 변화 문제는 한 나라만의 노력으로 충분히 해결할 수 있다.','X','기후 변화는 국가 간 협력과 개인·기업·정부의 공동 노력이 필요한 문제예요.'],['short','현재 세대와 미래 세대가 함께 누릴 수 있도록 자원을 아껴 쓰는 삶은?',['지속가능한삶','지속 가능한 삶'],'지속 가능한 삶은 환경과 사회에 미치는 영향을 고려하는 생활 방식이에요.'],['ox','민주 사회에서 시민은 선거 등을 통해 정치 과정에 참여할 수 있다.','O','선거, 청원, 공론장 참여 등은 시민 참여의 방식이에요.'],['short','다수의 의견을 존중하되 소수의 권리도 보호해야 한다는 민주주의 원리는?',['다수결','다수결의원리','다수결의 원리'],'다수결은 소수 의견 존중과 기본권 보장 속에서 이루어져야 해요.'],['ox','헌법은 국민의 기본권을 보장하는 국가의 최고 법이다.','O','헌법은 국가의 기본 질서와 국민의 권리·의무를 정해요.'],['short','국민이 국가의 주인이라는 민주주의의 기본 원리는?',['국민주권','국민 주권'],'국민 주권은 국가의 의사가 국민의 뜻에 따라 결정되어야 한다는 원리예요.'],['ox','표현의 자유는 다른 사람의 인권을 침해해도 언제나 제한 없이 보장된다.','X','표현의 자유도 타인의 명예와 권리 등을 침해하지 않는 범위에서 보장돼요.'],['short','누구나 인간다운 생활을 할 권리를 보장하는 기본권은?',['사회권'],'사회권은 교육·근로·사회 보장 등 인간다운 생활과 관련된 권리예요.'],['ox','공정한 절차는 결과의 공정성과 함께 사회 정의를 판단하는 기준이 될 수 있다.','O','정의는 분배 결과뿐 아니라 결정 과정이 공정했는지도 중요하게 봐요.'],['short','필요한 재화와 서비스를 생산·분배·소비하는 활동을 무엇이라고 하나요?',['경제활동','경제 활동'],'경제 활동에는 생산, 분배, 소비가 포함돼요.'],['ox','수요가 늘고 공급이 그대로라면 일반적으로 가격은 오를 가능성이 있다.','O','수요와 공급의 변화는 시장 가격에 영향을 줘요.'],['short','같은 가격에서 소비자가 사고자 하는 재화의 양을 무엇이라고 하나요?',['수요'],'수요는 일정한 가격에서 구매하려는 의사와 능력을 뜻해요.'],['ox','공공재는 보통 여러 사람이 함께 이용할 수 있는 재화나 서비스와 관련 있다.','O','국방, 치안, 공원 등은 공공재의 예로 생각할 수 있어요.'],['short','환경오염처럼 거래 당사자 이외의 사람에게 영향을 주는 현상을 무엇이라고 하나요?',['외부효과','외부 효과'],'외부 효과에는 대가 없이 피해를 주는 부정적 외부 효과도 있어요.'],['ox','문화 상대주의는 자기 문화의 기준으로 다른 문화를 낮게 평가하는 태도이다.','X','문화 상대주의는 각 문화가 지닌 맥락과 가치를 이해하려는 태도예요.'],['short','서로 다른 문화가 만나면서 새롭게 섞여 나타나는 현상은?',['문화융합','문화 융합'],'문화 융합은 서로 다른 문화 요소가 결합해 새 문화를 만드는 현상이에요.'],['ox','국제기구는 국가들이 공동의 문제를 해결하기 위해 협력하는 방식 중 하나이다.','O','국제기구는 평화, 보건, 환경 등 국제 문제 해결에 기여해요.'],['short','국경을 넘어 인권·환경 문제 해결에 책임을 느끼는 사람을 무엇이라고 하나요?',['세계시민','세계 시민'],'세계 시민은 인류 공동의 문제에 관심을 두고 행동해요.'],['ox','재활용과 재사용은 자원 순환을 실천하는 방법이 될 수 있다.','O','재사용과 재활용은 자원 낭비와 폐기물을 줄이는 데 도움이 돼요.'],['short','갈등을 폭력 대신 대화와 타협으로 해결하려는 태도는?',['평화적해결','평화적 해결','평화'],'평화적 해결은 서로의 입장을 듣고 협력 방안을 찾는 과정이에요.'],['ox','선거에 참여하는 것은 시민이 정치 과정에 참여하는 방법이다.','O','시민은 선거뿐 아니라 청원, 토론, 시민 단체 활동 등으로 참여할 수 있어요.'],['short','국가가 권력을 나누어 서로 견제하게 하는 원리는?',['권력분립','권력 분립','삼권분립','삼권 분립'],'권력 분립은 권력 남용을 막고 민주주의를 지키는 데 도움이 돼요.'],['ox','인권 침해를 줄이기 위해서는 법과 제도뿐 아니라 시민의 관심도 중요하다.','O','인권 보장은 제도와 함께 서로를 존중하는 시민 의식으로 실천돼요.'],['short','지역·세대·성별 등의 차이로 기회와 대우가 달라지는 문제를 무엇이라고 하나요?',['차별'],'차별은 개인의 능력과 무관한 특성 때문에 불리한 대우를 받는 문제예요.']],'한국사2':[
['ox','1910년 국권 피탈 이후 우리나라는 일제의 식민 통치를 받았다.','O','일제는 무단 통치, 문화 통치, 민족 말살 통치 등을 실시했어요.'],['short','1919년 3월 1일에 전국적으로 일어난 독립 만세 운동은?',['3·1운동','3.1운동','삼일운동'],'3·1 운동은 국내외 독립 운동이 발전하는 중요한 계기가 되었어요.'],['ox','대한민국 임시 정부는 3·1 운동 이후 중국 상하이에서 수립되었다.','O','대한민국 임시 정부는 민주 공화제 정부를 표방했어요.'],['short','일제가 우리말 사용을 억압하고 이름을 일본식으로 바꾸게 한 정책은?',['민족말살통치','민족 말살 통치'],'일제는 전쟁 수행을 위해 황국 신민화와 민족 말살 통치를 강화했어요.'],['ox','봉오동 전투와 청산리 대첩은 독립군의 무장 투쟁과 관련 있다.','O','독립군은 만주 등지에서 일제에 맞서 무장 투쟁을 전개했어요.'],['short','일제 강점기에 우리 민족의 말과 글을 연구·보급한 단체는?',['조선어학회','조선어 학회'],'조선어 학회는 우리말 큰사전 편찬 등을 추진했어요.'],['ox','광복은 1945년 8월 15일에 이루어졌다.','O','광복은 제2차 세계 대전에서 일본이 패망하며 맞이했어요.'],['short','광복 직후 한반도 남쪽에 들어온 미국 군정의 이름은?',['미군정','미 군정'],'광복 후 한반도는 38도선을 기준으로 미군과 소련군이 진주했어요.'],['ox','대한민국 정부는 1948년에 수립되었다.','O','1948년 8월 15일 대한민국 정부가 수립되었어요.'],['short','1950년에 일어나 한반도에 큰 피해를 남긴 전쟁은?',['6·25전쟁','6.25전쟁','한국전쟁','한국 전쟁'],'6·25 전쟁은 남북 분단을 고착화하고 큰 인명·재산 피해를 남겼어요.'],['ox','4·19 혁명은 부정 선거에 항의한 시민과 학생들의 민주화 운동이다.','O','4·19 혁명으로 이승만 정부가 물러났어요.'],['short','1980년 5월 광주에서 민주화를 요구하며 일어난 시민 항쟁은?',['5·18민주화운동','5.18민주화운동','5·18 광주 민주화 운동'],'5·18 민주화 운동은 한국 민주주의 발전의 중요한 역사예요.'],['ox','1970년대 이후 경제 성장 과정에서 도시화와 산업화가 빠르게 진행되었다.','O','경제 성장과 함께 인구 이동, 도시 문제, 노동 문제 등 사회 변화도 나타났어요.'],['short','1987년 대통령 직선제 개헌을 이끌어 낸 민주화 운동은?',['6월민주항쟁','6월 민주 항쟁'],'6월 민주 항쟁은 민주주의 발전에 중요한 전환점이 되었어요.'],['ox','남북 기본 합의서는 남북 사이의 화해와 협력을 위한 노력과 관련 있다.','O','남북 관계는 대화와 긴장이 반복되는 가운데 변화해 왔어요.'],['short','대한민국에서 국민이 대표를 뽑아 국가 일을 맡기는 정치 제도는?',['민주주의','대의민주주의','대의 민주주의'],'대한민국은 국민 주권을 바탕으로 하는 민주 공화국이에요.'],['ox','우리나라의 민주화 과정은 시민들의 참여와 노력과 무관하게 이루어졌다.','X','학생, 시민, 노동자 등 다양한 사람들의 참여가 민주화에 중요한 역할을 했어요.'],['short','1997년 외환 위기 때 국제 통화 기금에서 지원을 받은 일을 줄여 부르는 말은?',['imf','imf외환위기','imf 외환 위기'],'외환 위기는 경제 구조와 고용에 큰 영향을 주었어요.'],['ox','역사 자료는 만들어진 시대와 목적을 고려하여 비판적으로 해석해야 한다.','O','역사적 사실을 이해할 때는 자료의 성격과 관점을 살피는 태도가 중요해요.'],['short','과거의 일을 조사하고 해석하여 현재와 미래를 이해하려는 학문은?',['역사'],'역사 학습은 과거와 현재의 연결을 이해하는 데 도움을 줘요.'],['ox','1910년 한일 병합 조약으로 대한제국의 국권이 빼앗겼다.','O','국권 피탈 이
